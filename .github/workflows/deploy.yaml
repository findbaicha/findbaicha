name: Deploy Hugo Site to GitHub Pages

on:
  push:
    branches:
      - master  # 监听 main 分支的推送事件。如果您的分支名叫 master，请更改此处。
  # 也可以手动在 GitHub Actions 页面触发部署
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # 确保不拉取子模块，避免冲突
          fetch-depth: 0

      # 【核心新增步骤】：直接使用 git clone 拉取主题
      - name: Clone Theme
        run: git clone https://github.com/kong-htop/kong-htop themes/kong-htop

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build Hugo Site
        run: hugo --minify
        
      # ... (其余步骤，如 Upload Artifact 和 Deploy 保持不变)

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public # 上传 Hugo 生成的静态文件目录

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
