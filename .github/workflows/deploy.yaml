name: Deploy Hugo Site to GitHub Pages

on:
  push:
    branches:
      - master  # 监听 main 分支的推送事件。如果您的分支名叫 master，请更改此处。
  # 也可以手动在 GitHub Actions 页面触发部署
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive  # 确保您的主题（kong-htop）被正确克隆
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          # 使用最新的 Extended 版本，支持 Sass/SCSS
          hugo-version: 'latest'
          extended: true

      - name: Build Hugo Site
        # 执行 Hugo 构建命令，生成静态文件到 public 目录
        run: hugo --minify

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public # 上传 Hugo 生成的静态文件目录

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
