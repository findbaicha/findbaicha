name: Deploy Hugo Site to GitHub Pages

on:
  push:
    branches:
      - master  # 监听 main 分支的推送事件。如果您的分支名叫 master，请更改此处。
  # 也可以手动在 GitHub Actions 页面触发部署
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 移除手动安装步骤，改为使用 SSH key 拉取子模块
      - name: Checkout Code with Submodules
        uses: actions/checkout@v4
        with:
          # 必须使用 SSH 方式来拉取子模块
          ssh-key: ${{ secrets.ACTIONS_DEPLOY_KEY }} 
          # 必须设置 submodules 为 true
          submodules: true 
          fetch-depth: 0

      # 2. 移除 Install Theme Submodules 步骤 (因为它现在已经集成到上面了)
      
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build Hugo Site
        run: hugo --minify

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public # 上传 Hugo 生成的静态文件目录

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
