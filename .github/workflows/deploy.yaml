name: Deploy Hugo Site to GitHub Pages

on:
  push:
    branches:
      - master  # 监听 main 分支的推送事件。如果您的分支名叫 master，请更改此处。
  # 也可以手动在 GitHub Actions 页面触发部署
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code (No Submodules)
        uses: actions/checkout@v4
        with:
          # 移除 submodules: true/recursive 和 token，只检出主仓库
          fetch-depth: 0

      # 新增步骤：手动执行子模块更新
      - name: Install Theme Submodules
        run: git submodule update --init --recursive
        
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build Hugo Site
        run: hugo --minify
      
      # ... (其余步骤保持不变)
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public # 上传 Hugo 生成的静态文件目录

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
